coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false
        if_not_found: failure

# The story catalog is generated by story_check and only read through the Tauri
# commands; `story:check:strict` guards it instead of tests.
ignore:
  - 'src-tauri/src/story/generated.rs'
