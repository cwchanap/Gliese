name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Verify story content references are current
        run: bun tools/export-story-content-references.ts --check

      - name: Build
        run: bun run build

      - name: Assert no frontend story prose (Tauri build)
        run: |
          bun run build --mode tauri
          bun run story:assert-no-frontend-prose

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Playwright Chromium (for browser unit tests)
        run: bunx playwright install --with-deps chromium

      - name: Run unit tests with coverage
        run: bun run test:unit -- --run --coverage

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: frontend

  rust-build-lint:
    name: Rust Build & Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Story consistency check
        working-directory: .
        run: cargo run --manifest-path src-tauri/Cargo.toml --bin story_check -- --mode=strict --check-generated

      - name: Build
        run: cargo build

  rust-test:
    name: Rust Unit Tests
    runs-on: ubuntu-24.04
    needs: rust-build-lint
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload Rust coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: lcov.info
          flags: rust

  # Single blocking e2e job: `bun run test:e2e` builds once, so there is no
  # separate build step. The design's ~10-minute target is for the whole job
  # (checkout, install, Chromium install, build and tests) and is not yet met:
  # the last measured run took ~15 minutes, ~5.5 of them installing Chromium.
  # The 20-minute timeout is a hard cap, not the target. Playwright's
  # globalTimeout only covers the test run, so the test step passes it the
  # job budget left after setup (minus a reserve for build + report upload);
  # a slow setup then cannot cancel the run before the upload runs — under
  # four minutes left, the step fails outright instead of handing Playwright
  # a budget the job cannot honor.
  # Keep E2E_JOB_CAP_MINUTES in sync with timeout-minutes.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_JOB_CAP_MINUTES: '20'
    steps:
      - name: Record job start
        run: echo "E2E_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: |
          remaining_s=$(( E2E_JOB_CAP_MINUTES * 60 - ($(date +%s) - E2E_JOB_START) ))
          if (( remaining_s < 240 )); then
            echo "::error::e2e setup left ${remaining_s}s of the ${E2E_JOB_CAP_MINUTES}-minute job budget; at least 240s are needed (60s minimum run + 180s build/upload reserve)"
            exit 1
          fi
          budget_s=$(( remaining_s - 180 ))
          PLAYWRIGHT_GLOBAL_TIMEOUT_MS=$(( budget_s * 1000 )) bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
