name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-and-lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Verify Meadow Entry runtime data is current
        run: bun run world:generate:meadow-entry-runtime --check

      - name: Verify story content references are current
        run: bun tools/export-story-content-references.ts --check

      - name: Build
        run: bun run build

      - name: Assert no frontend story prose (Tauri build)
        run: |
          bun run build --mode tauri
          bun run story:assert-no-frontend-prose

  unit-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Playwright Chromium (for browser unit tests)
        run: bunx playwright install --with-deps chromium

      - name: Run unit tests with coverage
        # Core CI checks out without Git LFS, so skip the asset-byte tests that
        # hash/decode real LFS-tracked PNGs. They run in the Asset Integrity
        # workflow, which fetches LFS (nightly + on asset-path changes).
        run: |
          bun run test:unit -- --run --coverage \
            --exclude 'src/lib/game/content/village-interior-assets.asset.test.ts' \
            --exclude 'src/lib/game/content/backgrounds/meadow-entry-art-proofs.test.ts' \
            --exclude 'src/lib/game/content/backgrounds/meadow-entry-painted-v2-pilot.test.ts' \
            --exclude 'src/lib/game/content/backgrounds/meadow-entry-painted-v2-underlay-assembly.test.ts'

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: frontend

  rust-build-lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Rust Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Story consistency check
        working-directory: .
        run: cargo run --manifest-path src-tauri/Cargo.toml --bin story_check -- --mode=strict --check-generated

      - name: Build
        run: cargo build

  rust-test:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    needs: rust-build-lint
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload Rust coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: lcov.info
          flags: rust

  # E2E tests live in the Asset Integrity workflow (.github/workflows/asset-integrity.yml).
  # The e2e suite renders real LFS-tracked background/interior PNGs as Phaser textures,
  # so it cannot run in core CI, which checks out without Git LFS.
