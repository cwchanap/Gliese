name: Asset Integrity

# Verifies tests that read real Git LFS image bytes (interior base PNGs,
# meadow-entry painted-v2 source panels / underlays / proof snapshots) and
# the e2e suite, which renders those images as Phaser textures. These cannot
# run in the core CI workflow, which checks out without LFS to stay fast and
# within GitHub LFS bandwidth quotas.
#
# Runs:
#   - weekly (Monday 03:00 UTC)
#   - on demand (workflow_dispatch)
#   - on push/PR when asset-relevant paths change
#
# The cadence is weekly (not daily) to limit LFS bandwidth: each run fetches
# the full ~184 MB LFS payload, and GitHub Actions LFS downloads count against
# the repo owner's bandwidth allowance. Path-triggered and manual runs cover
# asset PRs between scheduled runs.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      lanes:
        description: Asset Integrity lanes to run
        required: true
        default: full
        type: choice
        options:
          - full
          - gate-only
      gate_workers:
        description: Gate workers for runner-side measurement
        required: true
        default: '2'
        type: choice
        options:
          - '2'
          - '4'
  push:
    branches: [main]
    paths:
      - 'public/game/assets/**'
      - 'artifacts/**'
      - '.gitattributes'
      - '.github/workflows/asset-integrity.yml'
      - 'src/lib/game/content/**'
      - 'tests/e2e/**'
      - 'vite.config.ts'
      - 'playwright.config.ts'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'public/game/assets/**'
      - 'artifacts/**'
      - '.gitattributes'
      - '.github/workflows/asset-integrity.yml'
      - 'src/lib/game/content/**'
      - 'tests/e2e/**'
      - 'vite.config.ts'
      - 'playwright.config.ts'

permissions:
  contents: read

concurrency:
  group: asset-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  asset-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Asset Unit & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEFAULT_GATE_WORKERS: '2'
      CI_SKIP_EXHAUSTIVE_ASSEMBLY: >-
        ${{ (github.event_name == 'pull_request' ||
             (github.event_name == 'workflow_dispatch' && inputs.lanes == 'gate-only'))
            && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - name: Verify LFS objects were fetched (not pointer stubs)
        run: |
          set -euo pipefail
          # An LFS pointer stub begins with this signature line. Real content does not.
          pointer_sig='version https://git-lfs.github.com/spec/v1'
          stubs=""
          while IFS= read -r f; do
            if head -c 200 "$f" | grep -qF "$pointer_sig"; then
              stubs="$stubs\n$f"
            fi
          done < <(git lfs ls-files --name-only)
          if [ -n "$stubs" ]; then
            echo "::error::LFS pointer stubs detected; asset tests require real image bytes:$stubs"
            exit 1
          fi
          echo "All LFS-tracked files contain real content."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Report runner resources
        run: |
          echo "nproc=$(nproc)"
          free -m

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run LFS-dependent asset unit tests
        run: |
          bun run test:unit -- --run \
            src/lib/game/content/village-interior-assets.asset.test.ts \
            src/lib/game/content/backgrounds/meadow-entry-art-proofs.test.ts \
            src/lib/game/content/backgrounds/meadow-entry-painted-v2-pilot.test.ts \
            src/lib/game/content/backgrounds/meadow-entry-painted-v2-underlay-assembly.test.ts \
            src/lib/game/content/backgrounds/meadow-entry-painted-v2-complete-assembly.test.ts

      - name: Build for e2e
        run: bun run build

      - name: Run Playwright e2e gate (blocking)
        # The `gate` project (see playwright.config.ts) runs every e2e test
        # except the retired V1 regional-background proofs and the known-flaky
        # route-walking tests. A failure here gates the workflow.
        timeout-minutes: 25
        env:
          GATE_WORKERS: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.gate_workers
                || env.DEFAULT_GATE_WORKERS }}
        run: |
          bunx playwright test \
            --project=gate \
            --workers="$GATE_WORKERS" \
            --fully-parallel \
            --reporter=list

      - name: Upload gate Playwright report
        # Upload the gate run's artifacts BEFORE the flaky run starts. Playwright
        # cleans `test-results/` and overwrites `playwright-report/` at the start
        # of each invocation, so a subsequent `--project=flaky` run would wipe
        # the gate's failure screenshots/traces — the most important artifacts
        # for debugging a gate failure. This step runs on gate success or
        # failure (`!cancelled()`), but is skipped on manual cancel.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: asset-integrity-gate-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Run exhaustive painted-interior e2e
        if: >-
          ${{ !cancelled() &&
              github.event_name != 'pull_request' &&
              (github.event_name != 'workflow_dispatch' || inputs.lanes == 'full') }}
        run: bunx playwright test --project=exhaustive --workers=1

      - name: Upload exhaustive Playwright report
        if: >-
          ${{ !cancelled() &&
              github.event_name != 'pull_request' &&
              (github.event_name != 'workflow_dispatch' || inputs.lanes == 'full') }}
        uses: actions/upload-artifact@v4
        with:
          name: asset-integrity-exhaustive-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Run known-flaky route-walking e2e (non-blocking)
        # The `flaky` project isolates route-walking tests with pre-existing
        # timing/precision failures on CI runners (hero gets stuck at collision
        # boundaries, route segments not axis-aligned). These are unrelated to
        # asset integrity and need separate investigation. Results are uploaded
        # for inspection but do not gate the workflow.
        if: >-
          ${{ !cancelled() &&
              github.event_name != 'pull_request' &&
              (github.event_name != 'workflow_dispatch' || inputs.lanes == 'full') }}
        continue-on-error: true
        run: bunx playwright test --project=flaky --workers=1

      - name: Upload flaky Playwright report
        if: >-
          ${{ !cancelled() &&
              github.event_name != 'pull_request' &&
              (github.event_name != 'workflow_dispatch' || inputs.lanes == 'full') }}
        uses: actions/upload-artifact@v4
        with:
          name: asset-integrity-flaky-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
