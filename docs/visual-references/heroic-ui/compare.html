<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Heroic UI — mockup vs runtime</title>
		<style>
			:root {
				color-scheme: dark;
				--ink: #070512;
				--panel: #142a63;
				--gold: #ffe08a;
				--muted: #9aa7c7;
			}
			body {
				margin: 0;
				background: var(--ink);
				color: #eef2ff;
				font: 14px/1.5 system-ui, sans-serif;
			}
			header {
				position: sticky;
				top: 0;
				z-index: 10;
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 1rem;
				padding: 0.75rem 1.25rem;
				background: rgba(12, 26, 74, 0.92);
				border-bottom: 1px solid rgba(255, 232, 170, 0.35);
				backdrop-filter: blur(6px);
			}
			header h1 {
				margin: 0;
				font-size: 1rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--gold);
			}
			header label {
				display: flex;
				align-items: center;
				gap: 0.4rem;
				color: var(--muted);
				cursor: pointer;
				user-select: none;
			}
			header nav {
				margin-left: auto;
				display: flex;
				flex-wrap: wrap;
				gap: 0.35rem;
			}
			header nav a {
				color: var(--muted);
				text-decoration: none;
				padding: 0.15rem 0.5rem;
				border-radius: 999px;
				border: 1px solid transparent;
			}
			header nav a:hover {
				color: var(--gold);
				border-color: rgba(255, 232, 170, 0.4);
			}
			section {
				max-width: 1720px;
				margin: 0 auto;
				padding: 1.5rem 1.25rem 3rem;
			}
			.pair {
				margin-bottom: 2.5rem;
				scroll-margin-top: 4rem;
			}
			.pair h2 {
				display: flex;
				align-items: baseline;
				gap: 0.75rem;
				font-size: 1rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--gold);
				border-bottom: 1px solid rgba(255, 232, 170, 0.25);
				padding-bottom: 0.4rem;
			}
			.pair h2 .note {
				font-size: 0.75rem;
				letter-spacing: 0.02em;
				text-transform: none;
				color: var(--muted);
				font-weight: 400;
			}
			.cols {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 0.75rem;
			}
			figure {
				margin: 0;
			}
			figcaption {
				margin-bottom: 0.35rem;
				color: var(--muted);
				font-size: 0.78rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}
			figcaption a {
				color: inherit;
			}
			img {
				display: block;
				width: 100%;
				height: auto;
				border: 1px solid rgba(255, 232, 170, 0.2);
				border-radius: 6px;
				background: #000;
			}
			/* Overlay slider mode */
			.slider {
				position: relative;
				overflow: hidden;
				border-radius: 6px;
				border: 1px solid rgba(255, 232, 170, 0.2);
				background: #000;
				touch-action: none;
			}
			.slider img {
				border: none;
				border-radius: 0;
				pointer-events: none;
				-webkit-user-drag: none;
				user-select: none;
			}
			.slider img.top {
				position: absolute;
				inset: 0;
				clip-path: inset(0 50% 0 0);
			}
			.slider .handle {
				position: absolute;
				top: 0;
				bottom: 0;
				left: 50%;
				width: 2px;
				background: var(--gold);
				cursor: ew-resize;
			}
			.slider .handle::after {
				content: '↔';
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				background: var(--gold);
				color: var(--ink);
				font-size: 0.8rem;
				font-weight: 700;
				padding: 0.1rem 0.45rem;
				border-radius: 999px;
			}
			.slider figcaption {
				position: absolute;
				top: 0.5rem;
				z-index: 2;
			}
			.slider figcaption.src {
				left: 0.6rem;
			}
			.slider figcaption.run {
				right: 0.6rem;
			}
			.hidden {
				display: none;
			}
			@media (max-width: 900px) {
				.cols {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Heroic UI · source vs runtime</h1>
			<label><input type="checkbox" id="sliderToggle" /> overlay slider mode</label>
			<nav id="toc"></nav>
		</header>
		<main id="pairs"></main>

		<script>
			// Pair registry: source (mockup) vs runtime (gameplay) at 1440×900.
			const PAIRS = [
				{ id: 'title', label: '01 · Title', src: 'source/01-title.png', run: 'runtime/01-title.png' },
				{ id: 'field', label: '02 · Field HUD', src: 'source/02-field.png', run: 'runtime/02-field.png' },
				{ id: 'bag', label: '03 · Bag', src: 'source/03-bag.png', run: 'runtime/03-bag.png' },
				{ id: 'shop', label: '04 · Shop', src: 'source/04-shop.png', run: 'runtime/04-shop.png' },
				{ id: 'quest', label: '05 · Quest Journal', src: 'source/05-quest.png', run: 'runtime/05-quest.png' },
				{ id: 'dialogue', label: '06 · Dialogue', src: 'source/06-dialogue.png', run: 'runtime/06-dialogue.png' },
				{ id: 'battle', label: '07 · Battle', src: 'source/07-battle.png', run: 'runtime/07-battle.png' },
				{ id: 'victory', label: '08 · Victory', src: 'source/08-victory.png', run: 'runtime/08-victory.png' },
				{ id: 'save', label: '09 · Save', src: 'source/09-save.png', run: 'runtime/09-save.png' },
				{ id: 'system', label: '10 · System', src: 'source/10-system.png', run: 'runtime/10-system.png' },
				{ id: 'map', label: 'Area Map', src: null, run: 'runtime/map-regression.png', note: 'regression-only — no source canvas' },
				{ id: 'skill', label: 'Skill', src: null, run: 'runtime/skill-regression.png', note: 'regression-only — no source canvas' }
			];

			const main = document.getElementById('pairs');
			const toc = document.getElementById('toc');

			for (const p of PAIRS) {
				const section = document.createElement('section');
				section.className = 'pair';
				section.id = p.id;

				const h2 = document.createElement('h2');
				h2.textContent = p.label;
				if (p.note) {
					const n = document.createElement('span');
					n.className = 'note';
					n.textContent = p.note;
					h2.appendChild(n);
				}
				section.appendChild(h2);

				if (p.src) {
					// Side-by-side view
					const cols = document.createElement('div');
					cols.className = 'cols';
					for (const [imgPath, cap] of [
						[p.src, 'mockup (source)'],
						[p.run, 'gameplay (runtime)']
					]) {
						const fig = document.createElement('figure');
						const c = document.createElement('figcaption');
						const a = document.createElement('a');
						a.href = imgPath;
						a.target = '_blank';
						a.textContent = cap + ' — open full size';
						c.appendChild(a);
						const img = document.createElement('img');
						img.src = imgPath;
						img.alt = p.label + ' — ' + cap;
						img.loading = 'lazy';
						fig.appendChild(c);
						fig.appendChild(img);
						cols.appendChild(fig);
					}
					section.appendChild(cols);

					// Overlay slider view
					const slider = document.createElement('figure');
					slider.className = 'slider hidden';
					const capS = document.createElement('figcaption');
					capS.className = 'src';
					capS.textContent = '◀ mockup';
					const capR = document.createElement('figcaption');
					capR.className = 'run';
					capR.textContent = 'runtime ▶';
					const base = document.createElement('img');
					base.src = p.run;
					base.alt = p.label + ' — runtime (slider base)';
					const top = document.createElement('img');
					top.className = 'top';
					top.src = p.src;
					top.alt = p.label + ' — mockup (slider overlay)';
					const handle = document.createElement('div');
					handle.className = 'handle';
					handle.title = 'drag to compare';
					slider.append(capS, capR, base, top, handle);
					wireSlider(slider, top, handle);
					section.appendChild(slider);
				} else {
					const fig = document.createElement('figure');
					const c = document.createElement('figcaption');
					const a = document.createElement('a');
					a.href = p.run;
					a.target = '_blank';
					a.textContent = 'gameplay (runtime) — open full size';
					c.appendChild(a);
					const img = document.createElement('img');
					img.src = p.run;
					img.alt = p.label + ' — runtime';
					img.loading = 'lazy';
					fig.appendChild(c);
					fig.appendChild(img);
					section.appendChild(fig);
				}
				main.appendChild(section);

				const link = document.createElement('a');
				link.href = '#' + p.id;
				link.textContent = p.label.replace(/^\d+ · /, '');
				toc.appendChild(link);
			}

			function wireSlider(slider, topImg, handle) {
				let dragging = false;
				const setPos = (clientX) => {
					const rect = slider.getBoundingClientRect();
					const pct = Math.min(100, Math.max(0, ((clientX - rect.left) / rect.width) * 100));
					topImg.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
					handle.style.left = pct + '%';
				};
				handle.addEventListener('pointerdown', (e) => {
					dragging = true;
					handle.setPointerCapture(e.pointerId);
				});
				handle.addEventListener('pointermove', (e) => dragging && setPos(e.clientX));
				handle.addEventListener('pointerup', () => (dragging = false));
				slider.addEventListener('click', (e) => e.target !== handle && setPos(e.clientX));
			}

			document.getElementById('sliderToggle').addEventListener('change', (e) => {
				for (const s of document.querySelectorAll('section.pair')) {
					s.querySelector('.cols')?.classList.toggle('hidden', e.target.checked);
					s.querySelector('.slider')?.classList.toggle('hidden', !e.target.checked);
				}
			});
		</script>
	</body>
</html>
